# Development: `docker compose up -d db` starts only the database; the game runs with `bun dev`.
# Production: set POSTGRES_PASSWORD and HADAL_SECRET, then `docker compose up -d --build` runs both.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: hadal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hadal}
      POSTGRES_DB: hadal
    volumes:
      - db:/var/lib/postgresql
    ports:
      # Reachable from this machine only. 5433, because an installed Postgres often holds 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadal"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hadal:${POSTGRES_PASSWORD:-hadal}@db:5432/hadal
      # Seals the API keys players store: 32 characters or more, e.g. from `openssl rand -base64 32`.
      # Without it the game runs but keeps no keys. Changing it makes every stored key unreadable.
      HADAL_SECRET: ${HADAL_SECRET:-}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
