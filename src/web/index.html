<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Hadal</title>
    <meta name="description" content="A sea-themed trivia game: the rarer your right answer, the deeper your diver goes." />
    <meta name="theme-color" content="#f5c15a" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Link previews (Discord and others) need the image's full address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hadal" />
    <meta property="og:title" content="Hadal" />
    <meta property="og:description" content="A sea-themed trivia game: the rarer your right answer, the deeper your diver goes." />
    <meta property="og:image" content="https://hadal.seria.moe/og-2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <canvas class="pixels"></canvas>
      <canvas class="glow"></canvas>
      <input class="keys" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <input class="keys talk" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <button class="talk-button" type="button" hidden></button>
      <div class="said" role="log" aria-live="polite"></div>
      <form class="panel" hidden></form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
